<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14080a" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#b91c35" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Soft Crimson Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#glow)" />

  <!-- Outer Crimson Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#rimGrad)" stroke-width="16" stroke-linecap="round" />

  <!-- Inner Accent Ring -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="#e11d48" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 8" />

  <!-- Crossed Chef Fork & Knife Emblem -->
  <g filter="url(#shadow)" transform="translate(256, 225)">
    <!-- Fork (left-leaning) -->
    <g transform="rotate(-32)">
      <path d="M-8,120 L-6,20 C-6,10 -14,-10 -16,-30 L-16,-80 C-16,-85 -10,-85 -10,-80 L-10,-40 L-4,-40 L-4,-80 C-4,-85 2,-85 2,-80 L2,-40 L8,-40 L8,-80 C8,-85 14,-85 14,-80 L14,-30 C12,-10 4,10 4,20 L6,120 C6,126 -8,126 -8,120 Z" fill="#ffffff" />
    </g>

    <!-- Knife (right-leaning) -->
    <g transform="rotate(32)">
      <path d="M-6,120 L-4,20 L-2,10 C-2,10 -14,-20 -14,-80 C-14,-95 10,-95 12,-70 L12,20 L10,120 C10,126 -6,126 -6,120 Z" fill="#f43f5e" />
    </g>
  </g>

  <!-- Bottom Banner with AYOTD Monogram -->
  <g transform="translate(256, 395)">
    <rect x="-90" y="-24" width="180" height="48" rx="24" fill="#18090c" stroke="url(#rimGrad)" stroke-width="4" filter="url(#shadow)" />
    <text x="0" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">AYOTD</text>
  </g>
</svg>
